<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon Type_1 Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Predict Pokemon primary type (type_1)</h1>
      {% if not model_available %}
      <div class="alert alert-warning">
        No trained model found. Run <code>make_dummy_model.py</code> to create a test model.
      </div>
      {% endif %}

      <form method="post" action="/predict" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">height_dm</label>
          <input name="height_dm" class="form-control" type="number" step="0.1" value="10">
        </div>
        <div class="col-md-4">
          <label class="form-label">weight_hg</label>
          <input name="weight_hg" class="form-control" type="number" step="0.1" value="100">
        </div>
        <div class="col-md-4">
          <label class="form-label">type_2 (0-16)</label>
          <select name="type_2" class="form-select">
            {% for t in type2_options %}
            <option value="{{t}}">{{t}}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">hp</label>
          <input name="hp" class="form-control" type="number" value="50">
        </div>
        <div class="col-md-4">
          <label class="form-label">attack</label>
          <input name="attack" class="form-control" type="number" value="60">
        </div>
        <div class="col-md-4">
          <label class="form-label">defense</label>
          <input name="defense" class="form-control" type="number" value="55">
        </div>

        <div class="col-12">
          <button class="btn btn-primary">Predict</button>
        </div>
      </form>
    </div>
  </body>
</html>
